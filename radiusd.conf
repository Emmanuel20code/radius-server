# FreeRADIUS Configuration for Tailscale Deployment
# Auth and Acct listeners on standard RADIUS ports (1812, 1813)
# Binding to 0.0.0.0 to allow access from Tailscale network

listen {
    type = auth
    ipaddr = 0.0.0.0
    port = 1812
    proto = udp
}

listen {
    type = acct
    ipaddr = 0.0.0.0
    port = 1813
    proto = udp
}

# RADIUS Clients Configuration
client localhost {
    ipaddr = 127.0.0.1
    secret = Jevish2026!
    shortname = localhost
}

client tailscale-clients {
    ipaddr = 100.64.0.0/10
    secret = Jevish2026!
    shortname = tailscale-network
    nastype = other
}

# Optional: Add specific Tailscale clients here
# client your-device {
